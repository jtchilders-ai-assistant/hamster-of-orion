<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orion Debug Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111; color: #0f0; font-family: monospace; font-size: 14px; }
  #log { padding: 20px; max-width: 800px; }
  .pass { color: #0f0; }
  .fail { color: #f00; }
  .warn { color: #fa0; }
  .section { color: #0af; font-size: 16px; font-weight: bold; margin-top: 20px; border-bottom: 1px solid #333; padding-bottom: 5px; }
</style>
</head>
<body>
<div id="log"></div>
<script>
  const log = document.getElementById('log');
  let step = 0;
  function check(name, fn) {
    step++;
    try {
      const result = fn();
      const cls = result ? 'pass' : 'fail';
      log.innerHTML += `<div class="section">Step ${step}: ${name}</div>`;
      log.innerHTML += `<div class="${cls}">${result ? '✓ PASS' : '✗ FAIL'}</div>`;
      log.innerHTML += `<div>${typeof result === 'string' ? result : (typeof result === 'object' ? JSON.stringify(result, null, 2).substring(0, 200) : result)}</div>`;
      if (!result) {
        log.innerHTML += `<div class="warn">⚠ FAILED HERE - stopping</div>`;
        return false;
      }
    } catch (e) {
      log.innerHTML += `<div class="section">Step ${step}: ${name}</div>`;
      log.innerHTML += `<div class="fail">✗ EXCEPTION: ${e.message}</div>`;
      log.innerHTML += `<div>${e.stack}</div>`;
      log.innerHTML += `<div class="warn">⚠ EXCEPTION HERE - stopping</div>`;
      return false;
    }
    return true;
  }

  // Phase 1: DOM basics
  check('Document exists', () => typeof document !== 'undefined' ? true : false);
  check('Body exists', () => !!document.body);
  check('Create div', () => {
    const d = document.createElement('div');
    return d instanceof HTMLElement;
  });
  check('Append div to body', () => {
    const d = document.createElement('div');
    d.textContent = 'HELLO FROM JS';
    d.style.padding = '20px';
    d.style.background = '#003';
    d.style.fontSize = '24px';
    document.body.appendChild(d);
    return true;
  });

  // Phase 2: Canvas test (the suspected culprit)
  check('Create canvas element', () => {
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 600;
    return canvas instanceof HTMLCanvasElement ? 'Canvas created (800x600)' : false;
  });
  check('Canvas in body', () => {
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 600;
    document.body.appendChild(canvas);
    return 'Canvas appended to body';
  });
  check('Get 2D context', () => {
    const canvas = document.querySelector('canvas');
    if (!canvas) return 'No canvas found in body';
    const ctx = canvas.getContext('2d');
    if (!ctx) return 'getContext returned null!';
    ctx.fillStyle = '#0a0';
    ctx.font = '20px monospace';
    ctx.fillText('CANVAS CONTEXT WORKS', 20, 40);
    return '2D context obtained and text drawn';
  });

  // Phase 3: Try importing the app
  log.innerHTML += `<div class="section">Step ${++step}: Importing modules...</div>`;
  log.innerHTML += `<div class="warn">Loading modules from ./src/...</div>`;

  // Phase 4: Try creating the #app div and screens manually
  log.innerHTML += `<div class="section">Step ${++step}: Simulating App.ensureRoot()...</div>`;
  try {
    const appEl = document.getElementById('app');
    if (!appEl) {
      log.innerHTML += `<div class="fail">#app does NOT exist in DOM</div>`;
      log.innerHTML += `<div class="warn">Creating it manually...</div>`;
      const wrapper = document.createElement('div');
      wrapper.id = 'app';
      document.body.appendChild(wrapper);
      log.innerHTML += `<div class="pass">Created #app manually</div>`;
    } else {
      log.innerHTML += `<div class="pass">#app exists</div>`;
    }
    const root = document.getElementById('app');
    check('makeScreenContainer for new-game-screen', () => {
      if (!root) return false;
      let el = root.querySelector('#new-game-screen');
      if (!el) {
        el = document.createElement('div');
        el.id = 'new-game-screen';
        el.className = 'screen new-game-screen';
        root.appendChild(el);
      }
      el.style.display = 'flex';
      el.style.position = 'absolute';
      el.style.top = '0';
      el.style.left = '0';
      // Check actual size
      const rect = el.getBoundingClientRect();
      return `new-game-screen created: ${rect.width}x${rect.height}`;
    });
    check('new-game-screen content appended', () => {
      const el = document.getElementById('new-game-screen');
      if (!el) return 'Element not found';
      const inner = document.createElement('div');
      inner.className = 'wizard-panel';
      inner.style.width = '600px';
      inner.style.height = '500px';
      inner.style.background = '#001122';
      inner.style.border = '2px solid #0af';
      inner.style.borderRadius = '10px';
      inner.style.display = 'flex';
      inner.style.flexDirection = 'column';
      inner.style.justifyContent = 'center';
      inner.style.alignItems = 'center';
      inner.innerHTML = '<h1 style="color:#0af;font-size:28px;">HAMSTER OF ORION</h1><p style="color:#fff;font-size:18px;margin-top:20px;">If you see this, the screens are working!</p>';
      el.appendChild(inner);
      return 'Content appended to new-game-screen';
    });
  } catch(e) {
    log.innerHTML += `<div class="fail">EXCEPTION in manual screen creation: ${e.message}</div>`;
  }

  log.innerHTML += `<div class="section">=== RESULTS ===</div>`;
  log.innerHTML += `<div class="warn">If you see "HAMSTER OF ORION" text below, the CSS/JS works. If still blank, the issue is in your browser/environment.</div>`;
</script>
</body>
</html>
