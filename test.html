<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Debug Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: monospace; }
    #app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .test-panel { background: #222; padding: 40px; border: 2px solid #0af; }
  </style>
</head>
<body>
  <div id="app">
    <div class="test-panel">
      <h1 style="color: #0af; margin-bottom: 20px;">HAMSTER OF ORION - DEBUG</h1>
      <p>If you see this, HTML/CSS is working.</p>
      <p id="status" style="margin-top: 20px; color: #fa0;">Waiting for JS...</p>
    </div>
  </div>
  <script>
    document.getElementById('status').textContent = 'JavaScript is running! ✓';
    document.getElementById('status').style.color = '#0f0';
  </script>
</body>
</html>
